name: release on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump patch version and tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node scripts/next-release-version.mjs)"
          node -e 'const fs=require("fs"),v=process.argv[1]; const p=JSON.parse(fs.readFileSync("package.json")); p.version=v; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n"); const t="src-tauri/tauri.conf.json"; const c=JSON.parse(fs.readFileSync(t)); c.version=v; fs.writeFileSync(t,JSON.stringify(c,null,2)+"\n")' "$version"
          perl -0pi -e 's/^(version\s*=\s*")[^"]+("\s*$)/${1}'"$version"'${2}/m' src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml -p petomato --precise "$version"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="release/v$version"
          git switch -c "$branch"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "release: v$version"
          git tag -a "v$version" -m "Petomato v$version"
          git push --atomic origin "$branch" "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}" -f tag="${{ steps.version.outputs.tag }}"

      - name: Open version-bump pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh pr create --base main --head "release/$TAG" --title "Release $TAG" --body "Automated version bump for $TAG." || {
            echo "::warning::Could not open version-bump PR. Open release/$TAG into main manually; the release build has already been dispatched."
            exit 1
          }
